[workspace]
resolver = "3"
members = ["apps/desktop", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
vellum-core = { path = "crates/vellum-core" }

parking_lot = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }

[workspace.lints.clippy]
# section 5 of PLAN.md: no unwrap outside tests
unwrap_used = "warn"

[profile.release]
lto = "thin"
# the job queue catches panics inside jobs, so this must stay on unwind
panic = "unwind"
