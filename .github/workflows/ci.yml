name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ui checks first: the rust build embeds ui/dist, so it has to exist before cargo runs
      - name: typecheck
        run: pnpm --filter vellum-ui typecheck
      - name: eslint
        run: pnpm --filter vellum-ui lint
      - name: prettier
        run: pnpm --filter vellum-ui format:check
      - name: vitest
        run: pnpm --filter vellum-ui test
      - name: build ui
        run: pnpm --filter vellum-ui build

      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

      # cargo test regenerates ui/src/bindings, any change means someone forgot to commit them
      - name: typescript bindings are up to date
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- ui/src/bindings)" ]; then
            git status --porcelain -- ui/src/bindings
            echo "ui/src/bindings is out of date. run cargo test and commit the result."
            exit 1
          fi
